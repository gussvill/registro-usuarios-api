plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.0.0'
	id 'net.ltgt.errorprone' version '4.3.0'
}

group = 'com.registro'
version = '0.0.1-SNAPSHOT'
description = 'API REST de registro de usuarios'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	errorprone 'com.google.errorprone:error_prone_core:2.42.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.h2database:h2'
	testImplementation 'com.tngtech.archunit:archunit:1.4.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Descarga toda configuración resoluble (compile, runtime, test, procesadores de anotaciones, Error Prone,
// JaCoCo). El Dockerfile lo ejecuta antes de copiar las fuentes, de modo que los jars descargados quedan en
// una capa de imagen en caché hasta que cambie un archivo de build.
tasks.register('resolveDependencies') {
	group = 'help'
	description = 'Resolves and downloads the dependencies of every configuration.'
	doLast {
		configurations.matching { it.canBeResolved }.each { it.resolve() }
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
	options.compilerArgs += ['-Xlint:all,-processing', '-Werror']
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		html.required = true
		xml.required = true
	}
}

// Umbral de cobertura: las reglas de negocio (dominio y aplicación) deben mantenerse bien cubiertas.
// La infraestructura se ejercita con pruebas de slice y de contexto completo, pero deliberadamente no
// se somete al umbral. El elemento de la regla es BUNDLE, cuyo nombre no se puede filtrar con
// 'includes', así que en su lugar se acotan los archivos de clase analizados a los dos paquetes.
tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, include: [
			'com/registro/usuarios/domain/**',
			'com/registro/usuarios/application/**'
		])
	}))
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.28.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
