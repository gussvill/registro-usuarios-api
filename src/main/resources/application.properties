spring.application.name=registro-usuarios-api

# --- Base de datos: H2 en memoria, creada por el schema.sql versionado ---
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- JPA: Hibernate solo valida el script, nunca crea ni modifica tablas ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Herramientas de desarrollo ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false

# --- Reglas de registro (expresiones regulares; las barras invertidas se duplican en este archivo) ---
# El patrón del correo se aplica a la dirección en minúsculas, así que escríbalo en minúsculas.
# El valor por defecto de la contraseña es permisivo a propósito para que la contraseña del ejemplo pase.
app.registration.email-pattern=^[a-z0-9._%+-]+@[a-z0-9-]+(\\.[a-z0-9-]+)*\\.[a-z]{2,}$
app.registration.password-pattern=^(?=.*[A-Za-z])(?=.*[0-9])\\S{7,72}$

# --- Token ---
# El secreto de firma es opcional. Sin TOKEN_SECRET se genera una clave aleatoria de 256 bits en cada
# arranque y los tokens que firma no sobreviven a un reinicio. Un secreto configurado debe tener al menos 32
# bytes; la aplicación se niega a arrancar con uno más corto.
app.token.secret=${TOKEN_SECRET:}
app.token.expiration=15m

# --- Errores ---
# La API solo acepta JSON: sin soporte multipart, un cuerpo multipart recibe el 415 del contrato.
spring.servlet.multipart.enabled=false
# Una excepción resuelta ya está traducida al cuerpo de error; no se registra su mensaje, que puede
# citar el contenido de la petición.
spring.mvc.log-resolved-exception=false
# Hibernate registra una sentencia fallida junto con el mensaje de la base de datos, que cita el
# valor ofensor (en un duplicado, la dirección de correo en texto claro). El fallo ya se maneja y se
# informa a quien llama, por eso este logger se desactiva.
logging.level.org.hibernate.orm.jdbc.error=OFF
