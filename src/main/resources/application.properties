spring.application.name=registro-usuarios-api

# --- Database: in-memory H2, created by the versioned schema.sql ---
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- JPA: Hibernate only validates the script, it never creates or alters tables ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Development tools ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false

# --- Registration rules (regular expressions; backslashes are doubled in this file) ---
# The email pattern is applied to the lower-cased address, so write it in lower case.
# The password default is deliberately permissive so that the example password passes.
app.registration.email-pattern=^[a-z0-9._%+-]+@[a-z0-9-]+(\\.[a-z0-9-]+)*\\.[a-z]{2,}$
app.registration.password-pattern=^(?=.*[A-Za-z])(?=.*[0-9])\\S{7,72}$

# --- Token ---
# DEV ONLY: this default secret is public. Set TOKEN_SECRET (at least 32 bytes) for any real use.
# The application refuses to start with a shorter secret.
app.token.secret=${TOKEN_SECRET:local-placeholder-secret-value-0123456789abcdef}
app.token.expiration=15m

# --- Errors ---
# A resolved exception is already translated to the error body; do not log its message, which can
# quote the request payload.
spring.mvc.log-resolved-exception=false
