spring.application.name=registro-usuarios-api

# --- Database: in-memory H2, created by the versioned schema.sql ---
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- JPA: Hibernate only validates the script, it never creates or alters tables ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Development tools ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false

# --- Registration rules (regular expressions; backslashes are doubled in this file) ---
# The email pattern is applied to the lower-cased address, so write it in lower case.
# The password default is deliberately permissive so that the example password passes.
app.registration.email-pattern=^[a-z0-9._%+-]+@[a-z0-9-]+(\\.[a-z0-9-]+)*\\.[a-z]{2,}$
app.registration.password-pattern=^(?=.*[A-Za-z])(?=.*[0-9])\\S{7,72}$

# --- Token ---
# The signing secret is optional. Without TOKEN_SECRET a random 256-bit key is generated at each
# start and the tokens it signs do not survive a restart. A configured secret must be at least 32
# bytes; the application refuses to start with a shorter one.
app.token.secret=${TOKEN_SECRET:}
app.token.expiration=15m

# --- Errors ---
# A resolved exception is already translated to the error body; do not log its message, which can
# quote the request payload.
spring.mvc.log-resolved-exception=false
# Hibernate logs a failed statement together with the database message, which quotes the
# offending value (for a duplicate, the clear-text email address). The failure is already handled
# and reported to the caller, so this logger is switched off.
logging.level.org.hibernate.orm.jdbc.error=OFF
