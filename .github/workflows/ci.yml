name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v6

      # Compiles with Error Prone, checks formatting, runs every test and enforces the coverage gate.
      - name: Build
        run: ./gradlew build

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
          if-no-files-found: ignore

      - name: Build the container image
        run: docker build --tag registro-usuarios-api:ci .
