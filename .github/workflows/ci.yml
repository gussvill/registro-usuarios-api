name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El workflow solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle con caché de dependencias
        uses: gradle/actions/setup-gradle@v6

      # Compila con Error Prone, comprueba el formato, ejecuta todas las pruebas y aplica el umbral de cobertura.
      - name: Compilar y verificar
        run: ./gradlew build

      - name: Publicar los informes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
          if-no-files-found: ignore

      - name: Construir la imagen del contenedor
        run: docker build --tag registro-usuarios-api:ci .
